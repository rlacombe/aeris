[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aeris"
version = "0.1.0"
description = "AERIS: agent-first tools for air-pollution exposure assessment and environmental-health research."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Anonymous authors"}]
keywords = ["air quality", "exposure", "OpenAQ", "Google Maps", "PM2.5", "environmental health"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
  "pandas>=1.5",
  "numpy>=1.22",
  "matplotlib>=3.6",
  "requests>=2.28",
  "httpx>=0.24",
  "pgeocode>=0.4",
  "openaq>=0.3,<1.0",
  "joblib>=1.2",
  "xgboost>=1.7",
  "scikit-learn>=1.0",
  "rasterio>=1.3",
  "shapely>=2.0",
  "tqdm>=4.60",
]

[project.optional-dependencies]
# Enhanced visualization and geospatial capabilities
geo = ["geopandas>=0.13", "contextily>=1.3"]
viz = ["seaborn>=0.12"]
# Environment file support for easier configuration
env = ["python-dotenv>=1.0"]
# Optional literature-search helper used by the public research-tool contract
research = ["googlesearch-python>=1.2"]
# Local Model Context Protocol server for agent-host integration
mcp = ["mcp>=1.0"]
# All optional dependencies
all = ["geopandas>=0.13", "contextily>=1.3", "seaborn>=0.12", "python-dotenv>=1.0", "googlesearch-python>=1.2", "mcp>=1.0"]
# Benchmark providers (install the ones you need)
benchmark = ["anthropic>=0.40"]
benchmark-openai = ["openai>=1.0"]
benchmark-google = ["google-genai>=1.0"]
benchmark-all = ["anthropic>=0.40", "openai>=1.0", "google-genai>=1.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0", "mkdocstrings[python]>=0.24"]
dev = ["ruff>=0.4", "pytest>=7.0"]

[project.scripts]
aeris = "aeris.agent.launcher:main"
aeris-mcp = "aeris.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["aeris.exposure", "aeris"]

[tool.hatch.build]
include = [
  "aeris/**/*.py",
  "aeris/agent/skill.md",
  "aeris.exposure/**/*.py",
]

# ---------------------------------------------------------------------------
# Ruff – linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined names, etc.)
    "I",      # isort (import ordering)
    "UP",     # pyupgrade (modernize syntax for py39+)
    "B",      # flake8-bugbear (common pitfalls)
    "SIM",    # flake8-simplify (simplifiable code)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long — handled by the formatter
    "B904",   # raise-without-from-in-except — many bare re-raises in API error handling
    "SIM108", # use-ternary — sometimes if/else is clearer in scientific code
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["aeris", "benchmark"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
